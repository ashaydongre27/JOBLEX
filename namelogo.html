<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
  <title>Joble+ Animation</title> 
  <style> * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Roboto Mono", monospace;
  background: #f7f7f5;
  color: #111;
}

/* =========================
   Navigation
========================= */

nav {
  height: 72px;
  width: 100%;
  padding: 0 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(255, 255, 255, 0.9);
  border-bottom: 1px solid #e8e8e8;
}

/* =========================
   Logo
========================= */

.logo {
  display: inline-flex;
  align-items: baseline;

  color: #111;
  text-decoration: none;

  font-size: 28px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -1.5px;
}

/* =========================
   Animated Plus / X
========================= */

.plus {
  display: inline-block;

  margin-left: 1px;

  /*
    Move the + slightly downward
    so it aligns with "Joble"
  */
  position: relative;
  top: 2px;

  line-height: 1;
  vertical-align: baseline;

  /*
    Rotation happens around the
    center of the + / x
  */
  transform-origin: center center;

  /*
    8 second complete cycle
  */
  animation: plusToX 8s ease-in-out infinite;
}

/*
  Rotation:

  45deg  = X
  90deg  = +
  135deg = X

  The animation rotates clockwise
  by 45 degrees between each state.
*/

@keyframes plusToX {

  /* =========================
     X — initial state
  ========================= */

  0% {
    transform: rotate(45deg);
  }

  /* Hold X */
  25% {
    transform: rotate(45deg);
  }

  /* =========================
     Rotate clockwise to +
  ========================= */

  37.5% {
    transform: rotate(90deg);
  }

  /* Hold + */
  62.5% {
    transform: rotate(90deg);
  }

  /* =========================
     Rotate clockwise to X
  ========================= */

  75% {
    transform: rotate(135deg);
  }

  /* Hold X */
  100% {
    transform: rotate(135deg);
  }
}

/* =========================
   Navigation Links
========================= */

.nav-links {
  display: flex;
  gap: 32px;

  list-style: none;
}

.nav-links a {
  color: #555;

  text-decoration: none;

  font-size: 15px;
  font-weight: 500;

  transition: color 0.2s ease;
}

.nav-links a:hover {
  color: #111;
}

/* =========================
   Main / Hero
========================= */

main {
  min-height: calc(100vh - 72px);

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 40px;
}

/* =========================
   Hero Heading
========================= */

.hero h1 {
  font-size: clamp(48px, 8vw, 96px);

  letter-spacing: -5px;
  line-height: 1;

  margin-bottom: 24px;
}

/*
  The large hero + needs to sit
  slightly lower than the navbar +
*/

.hero h1 .plus {
  margin-left: 2px;
  top: 5px;
}

/* =========================
   Hero Paragraph
========================= */

.hero p {
  color: #777;

  font-size: 17px;
  line-height: 1.5;
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

  nav {
    padding: 0 20px;
  }

  .nav-links {
    display: none;
  }

  .logo {
    font-size: 25px;
  }

  .hero h1 {
    letter-spacing: -3px;
  }

  .hero h1 .plus {
    top: 4px;
  }
}

</style> </head> <body> <nav> <a href="#" class="logo"> Joble<span class="plus">+</span> </a>

<ul class="nav-links">
  <li><a href="#">Jobs</a></li>
  <li><a href="#">Companies</a></li>
  <li><a href="#">About</a></li>
</ul>

</nav> <main> <section class="hero"> <h1> Joble<span class="plus">+</span> </h1>
  <p>
    The "+" smoothly rotates into an "x" every 2 seconds.
  </p>
</section>

</main> </body> </html>
